<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tocando — Joseph Matthos</title>
  <meta name="theme-color" content="#0b0a0c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/player.css">
</head>
<body class="player-page">

  <div class="music-player--fullscreen" id="playerContainer">

    <!-- CABEÇALHO RETRÁTIL -->
    <header class="player-top" id="playerHeader">
      <button class="player-icon-btn" onclick="window.location.href='/'">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="6 9 12 15 18 9"/></svg>
      </button>

      <div class="mobile-tabs" role="tablist">
        <button class="mobile-tab active" data-tab="player">Player</button>
        <button class="mobile-tab" data-tab="music">Músicas</button>
        <button class="mobile-tab" data-tab="lyrics">Letra</button>
      </div>

      <button class="player-icon-btn" id="fullscreenBtn">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="player-grid" id="playerContent">
      
      <!-- ABA 1: PLAYER -->
      <div class="tab-content active" id="tab-player">
        <div class="player-col--cover">
          <div class="player-cover-wrap">
            <img class="album-cover" id="playerCover" src="" alt="Capa do Álbum">
          </div>
        </div>

        <div class="player-col--controls">
          <div class="player-track-info-center">
            <h1 class="track-title-large" id="playerTitle">Carregando...</h1>
            <p class="track-artist-large" id="playerArtist">Joseph Matthos</p>
          </div>

          <div class="progress-container">
            <div class="progress-bar" id="progressBar"><div class="progress" id="progressFill"></div></div>
            <div class="time-info"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
          </div>

          <div class="controls-main">
            <button class="control-btn" id="shuffleBtn"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
            
            <button class="control-btn" id="prevBtn" onclick="window.playerPrev()">
              <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>

            <button class="control-btn play-btn-large" id="playBtn" onclick="window.playerPlay()">
              <svg viewBox="0 0 24 24" width="38" height="38" id="playIcon"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
            </button>

            <button class="control-btn" id="nextBtn" onclick="window.playerNext()">
              <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>

            <button class="control-btn" id="repeatBtn"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
          </div>
        </div>
      </div>

      <!-- ABA 2: MÚSICAS -->
      <div class="tab-content" id="tab-music">
        <div class="album-tracklist-header">
          <div class="album-tracklist-cover" id="albumHeaderCover"></div>
          <div class="album-tracklist-info">
            <span class="album-tracklist-type">ÁLBUM</span>
            <h2 class="album-tracklist-title" id="albumHeaderTitle">Carregando...</h2>
            <p class="album-tracklist-artist" id="albumHeaderArtist"></p>
            <span class="album-tracklist-count" id="albumHeaderCount">0 faixas</span>
          </div>
        </div>
        <div class="music-list" id="musicList"></div>
      </div>

      <!-- ABA 3: LETRA -->
      <div class="tab-content" id="tab-lyrics">
        <div class="lyrics-scroll" id="lyricsContent">
          <p class="lyrics-empty">Nenhuma letra sincronizada.</p>
        </div>
      </div>

    </main>

    <!-- RODAPÉ RETRÁTIL -->
    <footer class="player-footer-actions" id="playerFooter">
      <div class="player-cta-actions" id="playerCtaActions">
        <button class="btn-cta btn-cta-outline" onclick="window.abrirModalAluguel()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="margin-right: 4px;"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4z"/></svg>
          Alugar
        </button>
        <button class="btn-cta btn-cta-primary" onclick="window.abrirModalAssinatura()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="margin-right: 4px;"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
          Assinar
        </button>
      </div>
    </footer>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
  <script src="js/player.js"></script>
</body>
</html>

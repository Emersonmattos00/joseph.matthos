services:
  - type: web
    name: josephmatthos
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      
      # ── Banco de Dados (Neon) ──
      - key: DATABASE_URL
        sync: false

      # ── Segurança e Autenticação ──
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://josephmatthos.onrender.com

      # ── Backblaze B2 (Armazenamento) ──
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_AUDIO_BUCKET
        value: josephmatthos
      - key: B2_IMAGE_BUCKET
        value: joseph.matthos
      - key: B2_REGION
        value: us-east-005
      - key: B2_ENDPOINT
        value: https://s3.us-east-005.backblazeb2.com

      # ── Upstash Redis (Rate Limit e Cache) ──
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # ── Mercado Pago (Pagamentos) ──
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
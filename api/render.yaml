services:
  - type: web
    name: joseph-matthos
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_AUDIO_BUCKET
        value: josephmatthos
      - key: B2_IMAGE_BUCKET
        value: joseph.matthos
      - key: B2_REGION
        value: us-east-005
      - key: B2_ENDPOINT
        value: https://s3.us-east-005.backblazeb2.com
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://josephmatthos.onrender.com
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a0c">
  <title>Tocando — Joseph Matthos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/player.css">
</head>
<body class="player-page">

  <div class="music-player--fullscreen" id="playerContainer">
    <header class="player-top" id="playerHeader">
      <button class="player-icon-btn" type="button" onclick="window.location.href='/'">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <nav class="mobile-tabs" role="tablist">
        <button class="mobile-tab active" data-tab="player" id="tab-button-player" aria-label="Player">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        </button>
        <button class="mobile-tab" data-tab="albums" id="tab-button-albums" aria-label="Álbuns">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 10l-2.5-1.5L14 12V7l3 1.5L19.5 7v5z"/></svg>
        </button>
        <button class="mobile-tab" data-tab="music" id="tab-button-music" aria-label="Músicas">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </button>
        <button class="mobile-tab" data-tab="lyrics" id="tab-button-lyrics" aria-label="Letra">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        </button>
        <button class="mobile-tab" data-tab="playlists" id="tab-button-playlists" aria-label="Playlists">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
        </button>
      </nav>
      <button class="player-icon-btn" id="fullscreenBtn" type="button" title="Tela cheia">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </header>

    <main class="player-grid" id="playerContent">
      <!-- ABA PLAYER -->
      <section class="tab-content active" id="tab-player" role="tabpanel">
        <div class="player-col--cover">
          <div class="player-cover-wrap">
            <img class="album-cover" id="playerCover" src="/assets/img/tema.webp" alt="Capa">
          </div>
        </div>
        <div class="player-col--controls">
          <div class="player-track-info-center">
            <h1 class="track-title-large" id="playerTitle">Carregando faixa...</h1>
            <p class="track-artist-large" id="playerArtist">Joseph Matthos</p>
          </div>
          <div class="progress-container">
            <div class="progress-bar" id="progressBar" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
              <div class="progress" id="progressFill"></div>
            </div>
            <div class="time-info">
              <span id="currentTime">0:00</span>
              <span id="duration">0:00</span>
            </div>
          </div>
          <div class="controls-main">
            <button class="control-btn" id="shuffleBtn" aria-label="Embaralhar"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
            <button class="control-btn" id="prevBtn" onclick="window.playerPrev()"><svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
            <button class="control-btn play-btn-large" id="playBtn" onclick="window.playerPlay()"><svg viewBox="0 0 24 24" width="38" height="38" id="playIcon"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
            <button class="control-btn" id="nextBtn" onclick="window.playerNext()"><svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
            <button class="control-btn" id="repeatBtn" aria-label="Repetir"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
          </div>
        </div>
      </section>

      <!-- ABA ÁLBUNS -->
      <section class="tab-content" id="tab-albums" role="tabpanel" hidden>
        <div class="albums-list" id="albumsList"></div>
      </section>

      <!-- ABA MÚSICAS -->
      <section class="tab-content" id="tab-music" role="tabpanel" hidden>
        <div class="album-tracklist-header" id="albumTracklistHeader" style="display: none;">
          <div class="album-tracklist-cover" id="albumHeaderCover"></div>
          <div class="album-tracklist-info">
            <span class="album-tracklist-type">ÁLBUM</span>
            <h2 class="album-tracklist-title" id="albumHeaderTitle">Carregando...</h2>
            <p class="album-tracklist-artist" id="albumHeaderArtist"></p>
            <span class="album-tracklist-count" id="albumHeaderCount">0 faixas</span>
          </div>
          <button class="btn-subscribe-header" id="headerSubscribeBtn" onclick="window.abrirModalAssinatura()">Assinar</button>
        </div>
        <div class="music-list" id="musicList"></div>
      </section>

      <!-- ABA LETRA -->
      <section class="tab-content" id="tab-lyrics" role="tabpanel" hidden>
        <div class="lyrics-scroll" id="lyricsContent">
          <p class="lyrics-empty">Nenhuma letra sincronizada.</p>
        </div>
      </section>

      <!-- ABA PLAYLISTS -->
      <section class="tab-content" id="tab-playlists" role="tabpanel" hidden>
        <div class="playlists-container" id="playlistsContainer">
          <p style="text-align:center;color:#aaa;padding:2rem;">Nenhuma playlist criada ainda.</p>
        </div>
      </section>
    </main>
  </div>

  <!-- MINI-PLAYER -->
  <div id="miniPlayer" class="mini-player" style="display: none;">
    <div class="mini-cover" id="miniCover"></div>
    <div class="mini-info">
      <div class="mini-title" id="miniTitle">Nenhuma música</div>
      <div class="mini-artist" id="miniArtist">Joseph Matthos</div>
    </div>
    <div class="mini-controls">
      <button id="miniPrevBtn" aria-label="Anterior">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button id="miniPlayBtn" aria-label="Play/Pause">
        <svg id="miniPlayIcon" viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="miniNextBtn" aria-label="Próximo">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <button id="miniOpenBtn" aria-label="Abrir player">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
      </button>
    </div>
  </div>

  <script src="/js/player.js?v=6" defer></script>
</body>
</html>

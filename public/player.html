<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0b0a0c">

  <meta
    name="description"
    content="Ouça as músicas de Joseph Matthos. Explore álbuns, faixas e letras."
  >

  <meta name="robots" content="noindex, follow">

  <title>Tocando — Joseph Matthos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..900&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/player.css">
  
  <style>
    .radio-badge {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #1DB954;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      font-family: 'Inter', sans-serif;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #1DB954;
      border-radius: 50%;
      animation: pulseRadio 1.5s infinite;
    }

    @keyframes pulseRadio {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

<body class="player-page">

  <div class="music-player--fullscreen" id="playerContainer">

    <!-- CABEÇALHO -->
    <header class="player-top" id="playerHeader">

      <button
        class="player-icon-btn"
        type="button"
        aria-label="Voltar para a página inicial"
        onclick="window.location.href='/'"
      >
        <svg viewBox="0 0 24 24"
             width="24"
             height="24"
             fill="none"
             stroke="currentColor"
             stroke-width="2.2"
             aria-hidden="true">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>

      <nav
        class="mobile-tabs"
        role="tablist"
        aria-label="Seções do player"
      >

        <button
          class="mobile-tab active"
          id="tab-button-player"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="tab-player"
          data-tab="player"
        >
          Player
        </button>

        <button
          class="mobile-tab"
          id="tab-button-music"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="tab-music"
          data-tab="music"
        >
          Músicas
        </button>

        <button
          class="mobile-tab"
          id="tab-button-lyrics"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="tab-lyrics"
          data-tab="lyrics"
        >
          Letra
        </button>

      </nav>

      <button
        class="player-icon-btn"
        id="fullscreenBtn"
        type="button"
        aria-label="Alternar tela cheia"
        title="Tela cheia"
      >
        <svg viewBox="0 0 24 24"
             width="22"
             height="22"
             fill="currentColor"
             aria-hidden="true">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
      </button>

    </header>

    <!-- CONTEÚDO -->
    <main class="player-grid" id="playerContent">

      <!-- PLAYER -->
      <section
        class="tab-content active"
        id="tab-player"
        role="tabpanel"
        aria-labelledby="tab-button-player"
      >

        <div class="player-col--cover">
          <div class="player-cover-wrap">

            <img
              class="album-cover"
              id="playerCover"
              src="/assets/img/tema.webp"
              alt="Capa do álbum"
              decoding="async"
            >

          </div>
        </div>

        <div class="player-col--controls">

          <div class="player-track-info-center">
            
            <div class="radio-badge" id="radioBadge">
              <span class="live-dot"></span> RÁDIO AO VIVO
            </div>

            <h1 class="track-title-large" id="playerTitle">
              Carregando faixa...
            </h1>

            <p class="track-artist-large" id="playerArtist">
              Joseph Matthos
            </p>

          </div>

          <div class="progress-container">

            <div
              class="progress-bar"
              id="progressBar"
              role="slider"
              aria-label="Posição da música"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              tabindex="0"
            >
              <div
                class="progress"
                id="progressFill"
              ></div>
            </div>

            <div class="time-info">
              <span id="currentTime">0:00</span>
              <span id="duration">0:00</span>
            </div>

          </div>

          <div class="controls-main">

            <button
              class="control-btn"
              id="shuffleBtn"
              type="button"
              aria-label="Embaralhar músicas"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24"
                   width="26"
                   height="26"
                   fill="none"
                   stroke="currentColor"
                   stroke-width="2"
                   aria-hidden="true">
                <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
              </svg>
            </button>

            <button
              class="control-btn"
              id="prevBtn"
              type="button"
              aria-label="Faixa anterior"
              onclick="window.playerPrev()"
            >
              <svg viewBox="0 0 24 24"
                   width="36"
                   height="36"
                   fill="currentColor"
                   aria-hidden="true">
                <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
              </svg>
            </button>

            <button
              class="control-btn play-btn-large"
              id="playBtn"
              type="button"
              aria-label="Reproduzir ou pausar"
              onclick="window.playerPlay()"
            >
              <svg viewBox="0 0 24 24"
                   width="38"
                   height="38"
                   id="playIcon"
                   aria-hidden="true">
                <path d="M8 5v14l11-7z" fill="currentColor"/>
              </svg>
            </button>

            <button
              class="control-btn"
              id="nextBtn"
              type="button"
              aria-label="Próxima faixa"
              onclick="window.playerNext()"
            >
              <svg viewBox="0 0 24 24"
                   width="36"
                   height="36"
                   fill="currentColor"
                   aria-hidden="true">
                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
              </svg>
            </button>

            <button
              class="control-btn"
              id="repeatBtn"
              type="button"
              aria-label="Repetir música"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24"
                   width="26"
                   height="26"
                   fill="none"
                   stroke="currentColor"
                   stroke-width="2"
                   aria-hidden="true">
                <path d="M17 1l4 4-4 4"/>
                <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                <path d="M7 23l-4-4 4-4"/>
                <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
              </svg>
            </button>

          </div>

        </div>

      </section>

      <!-- LISTA DE MÚSICAS -->
      <section
        class="tab-content"
        id="tab-music"
        role="tabpanel"
        aria-labelledby="tab-button-music"
        hidden
      >

        <div class="album-tracklist-header">

          <div
            class="album-tracklist-cover"
            id="albumHeaderCover"
          ></div>

          <div class="album-tracklist-info">

            <span class="album-tracklist-type">
              ÁLBUM
            </span>

            <h2
              class="album-tracklist-title"
              id="albumHeaderTitle"
            >
              Carregando...
            </h2>

            <p
              class="album-tracklist-artist"
              id="albumHeaderArtist"
            ></p>

            <span
              class="album-tracklist-count"
              id="albumHeaderCount"
            >
              0 faixas
            </span>

          </div>

          <button
            class="btn-subscribe-header"
            id="headerSubscribeBtn"
            type="button"
            onclick="window.abrirModalAssinatura()"
          >
            Assinar
          </button>

        </div>

        <div
          class="music-list"
          id="musicList"
          aria-label="Lista de músicas do álbum"
        ></div>

      </section>

      <!-- LETRAS -->
      <section
        class="tab-content"
        id="tab-lyrics"
        role="tabpanel"
        aria-labelledby="tab-button-lyrics"
        hidden
      >

        <div
          class="lyrics-scroll"
          id="lyricsContent"
          aria-live="polite"
        >

          <p class="lyrics-empty">
            Nenhuma letra sincronizada.
          </p>

        </div>

      </section>

    </main>

  </div>

  <script src="/js/player.js" defer></script>

</body>
</html>
